[tool.ruff]
line-length = 100
target-version = "py313" 
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = [
  "E501",  
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"